<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Acessos</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/style-login.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body class="login-page">

    <div class="login-card">
        <h2><i class="fa-solid fa-lock" style="color: #00BEDD;"></i> Área Restrita</h2>

        {% if error %}
        <div class="message-error">
            {{ error }}
        </div>
        {% endif %}

        <form action="/login" method="POST">
            <div class="field">
                <label for="email">E-mail</label>
                <input type="email" id="email" name="email" value="{{ user.email }}" placeholder="admin@tecon.com.br"
                    required>
            </div>

            <div class="field">
                <label for="password">Senha</label>
                <input type="password" id="password" name="password" placeholder="Sua senha secreta" required>
            </div>

            <button type="submit" class="button-send btn-login">Entrar</button>

            <div class="auth-links">
                <a href="/esqueci-senha" class="auth-link">Esqueci o Login ou Senha</a>
                <a href="/criar-acesso" class="auth-link">Criar Acesso</a>
            </div>
        </form>
    </div>

</body>

</html>
