{% extends 'layout.html' %}

{% block head %}
    <title>Novo Pagamento</title>
    <link rel="stylesheet" href="/css/acessos/styleAcessos.css">
    <link rel="stylesheet" href="/css/pagamentos/stylePagamentos.css">
{% endblock %}

{% block content %}
<div class="card">
    <div class="header-page form-header">
        <h2>Novo Lançamento</h2>
        <span class="user-badge">
            <i class="fa-solid fa-user"></i> {{ session.userName }}
        </span>
    </div>
    <hr class="divider-header">

    <!-- Adicionado o atributo NOVALIDATE para permitir o bloqueio via Javascript -->
    <form id="formPagamento" method="POST" action="/pagamentos/form" enctype="multipart/form-data" novalidate>
        
        <!-- GRUPO 1: SOLICITANTE, EMPRESA E PEDIDO -->
        <div class="grid-2-colunas">
            <div class="field field-pag">
                <label>Nome Contato Wilson Sons *</label>
                <input type="text" name="contato_interno" required>
            </div>
            <div class="field field-pag">
                <label>Setor</label>
                <select name="setor">
                    <option value="">Selecione...</option>
                    {% for s in setores %}
                        <option value="{{ s.nome }}">{{ s.nome }}</option>
                    {% endfor %}
                </select>
            </div>
        </div>

        <div class="grid-2-colunas">
            <div class="field field-pag">
                <label>Empresa *</label>
                <select name="empresa_id" required>
                    <option value="">Selecione...</option>
                    {% for emp in empresas %}
                        <option value="{{ emp.id }}">{{ emp.nome_exibicao }} ({{ emp.cnpj }})</option>
                    {% endfor %}
                </select>
            </div>
            <div class="field field-pag">
                <label>Pedido *</label>
                <input type="text" name="pedido_compra" required>
            </div>
        </div>

        <hr class="divider-section">

        <!-- GRUPO 2: DADOS DO PAGAMENTO -->
        <div class="grid-2-colunas">
            <div class="field field-pag">
                <label>CNPJ *</label>
                <input type="text" name="cnpj_nota" id="cnpj_input" placeholder="00.000.000/0000-00" maxlength="18" required>
            </div>
            <div class="field field-pag">
                <label>Fornecedor (Razão Social) *</label>
                <input type="text" name="razao_social" required>
            </div>
        </div>

        <div class="grid-2-colunas">
            <div class="field field-pag">
                <label>Tipo Documento *</label>
                <select name="tipo_documento" required>
                    <option value="">Selecione...</option>
                    <option value="NOTA FISCAL">Nota Fiscal</option>
                    <option value="FATURA">Fatura</option>
                    <option value="RECIBO">Recibo</option>
                </select>
            </div>
            <div class="field field-pag">
                <label>Número Documento</label>
                <input type="text" name="numero_nota_fatura">
            </div>
        </div>

        <div class="grid-2-colunas">
            <div class="field field-pag">
                <label>Anexo (Nota / Fatura / Recibo)</label>
                <input type="file" name="anexo_nota_fatura" class="input-file">
            </div>
            <div class="field field-pag">
                <label>Data da Emissão *</label>
                <input type="date" name="data_emissao_nota" required>
            </div>
        </div>

        <div class="grid-2-colunas">
            <div class="field field-pag">
                <label>Valor *</label>
                <input type="text" name="valor" id="valor_input" placeholder="R$ 0,00" required>
            </div>
            <div class="field field-pag">
                <label>Data do Vencimento *</label>
                <input type="date" name="data_vencimento" id="data_vencimento" required>
            </div>
        </div>

        <div class="grid-2-colunas">
            <div class="field field-pag">
                <label>Tipo Pagamento</label>
                <div class="radio radio-pag">
                    <label><input type="radio" name="tipo_pagamento" value="TED" checked onchange="togglePagamentos()"> TED</label>
                    <label><input type="radio" name="tipo_pagamento" value="Boleto" onchange="togglePagamentos()"> Boleto</label>
                </div>
                <div id="box_boleto" class="box-condicional">
                    <label class="label-condicional">Anexar Arquivo do Boleto *</label>
                    <input type="file" name="anexo_boleto" id="input_boleto" class="input-file">
                </div>
            </div>
            <div class="field field-pag">
                <label>O Serviço/Material foi entregue? *</label>
                <div class="radio radio-pag">
                    <label><input type="radio" name="servico_material_entregue" value="SIM" onchange="togglePagamentos()"> SIM</label>
                    <label><input type="radio" name="servico_material_entregue" value="NAO" checked onchange="togglePagamentos()"> NÃO</label>
                </div>
                <div id="box_mes" class="box-condicional" style="display: none; border: none; background: transparent; padding-left: 0;">
                    <label class="label-condicional">Data *</label>
                    <input type="date" name="mes_prestacao_servico" id="mes_input">
                </div>
            </div>
        </div>

        <div class="form-actions form-footer">
            <button type="button" class="button-cancel btn-action-padrao btn-voltar" onclick="window.location.href = '/pagamentos'">Cancelar</button>
            <button type="submit" class="button-send btn-action-padrao btn-novo">Enviar</button>
        </div>
    </form>
</div>

<script src="/scripts/scriptPagamentos.js"></script>
{% endblock %}
