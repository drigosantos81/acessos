{% extends 'layout.html' %}

{% block head %}
    <title>Dashboard de Pagamentos</title>
    <link rel="stylesheet" href="/css/acessos/styleAcessos.css">
    <link rel="stylesheet" href="/css/pagamentos/stylePagamentos.css">
    <!-- Chart.js continua no head por ser uma biblioteca externa -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
{% endblock %}

{% block content %}
<div class="card dashboard-card">
    
    <div class="header-page dashboard-header">
        <h2>Painel de Pagamentos (Tecon)</h2>
        <a href="/pagamentos/form" class="button-send btn-novo-pagamento">Novo Pagamento</a>
    </div>

    <div class="chart-container">
        <!-- O JS buscará os dados diretamente nestes atributos -->
        <canvas id="myChart" 
            data-solicitado="{{ stats.solicitado | default(0) }}"
            data-pendente="{{ stats.pendente | default(0) }}"
            data-confirmado="{{ stats.confirmado | default(0) }}"
            data-cancelado="{{ stats.cancelado | default(0) }}">
        </canvas>
    </div>

</div>

<!-- Chamada do arquivo JS externo -->
<script src="/scripts/scriptPagamentos.js"></script>
{% endblock %}
