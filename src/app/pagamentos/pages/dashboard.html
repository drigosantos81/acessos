{% extends 'layout.html' %}

{% block head %}
    <title>Painel de Pagamentos</title>
    <link rel="stylesheet" href="/css/acessos/styleAcessos.css">
    <link rel="stylesheet" href="/css/pagamentos/stylePagamentos.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
{% endblock %}

{% block content %}
<div class="card view-page-card">
    
    <div class="header-page view-header-page">
        <h2 class="view-title">Painel de Pagamentos</h2>
        <a href="/pagamentos/form" class="btn-action-padrao btn-novo">Novo</a>
    </div>

    <div class="filtros-empresa-container" style="margin-bottom: 20px; padding: 10px 15px;">
        <strong>Filtrar por Empresa:</strong>
        <div class="checkbox-group">
            {% for emp in empresas %}
            <label>
                <!-- onchange dispara o filtro global atualizando a URL para o Controller -->
                <input type="checkbox" class="filtro-empresa-cb" value="{{ emp.id }}" onchange="aplicarFiltroDataGlobal()" {% if emp.id in empresasArr %}checked{% endif %}>
                {{ emp.nome_exibicao }}
            </label>
            {% endfor %}
        </div>
    </div>

    <div class="view-card" style="display: flex; justify-content: center; align-items: center; min-height: 250px; padding: 30px;">
        <div class="chart-container" style="width: 320px; height: 180px;">
            <canvas id="myChart" 
                data-solicitado="{{ stats.solicitado }}" 
                data-pendente="{{ stats.pendente }}">
            </canvas>
        </div>
    </div>

</div>

<script src="/scripts/scriptPagamentos.js"></script>
{% endblock %}
